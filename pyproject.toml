[project]
name = "ai-fund-core"
version = "0.1.0"
description = "Shared core (config, notify, ledger, risk_gate) — keep dependencies minimal so it installs into every venv"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
