# TradingAgents committee (desks/committee/ta_committee.py)
version: 1
strategy_version: stocks-ta-v1         # change it whenever the models, prompts or rules change

# DeepSeek (paid, prepaid balance) since 2026-10-30 — Gemini free tier allows only
# 20 deep-model requests/day, not enough for a grid. Previous Gemini config:
#   provider google, quick gemini-3.5-flash-lite, deep gemini-3.8-flash
llm:
  provider: deepseek
  quick_model: deepseek-flash          # analysts, researchers, debaters, trader
  deep_model: deepseek-v4-pro          # research manager, portfolio manager
  max_retries: 8
  temperature: 0.2                     # set to null for Claude: the Messages API rejects temperature (400) since 2026-10-21

debate:
  max_debate_rounds: 1
  max_risk_discuss_rounds: 1

# USD per 1M tokens, used for api_costs.cost_usd. 0 = free tier.
# DeepSeek peak rates, cache-miss input (api-docs.deepseek.com/quick_start/pricing, 2026-10-30);
# off-peak is half, cache hits far cheaper — so recorded cost is an upper bound.
prices:
  deepseek-flash: {input: 0.30, output: 1.20}
  deepseek-v4-pro: {input: 1.32, output: 3.96}
  gemini-3.5-flash-lite: {input: 0.0, output: 0.0}
  gemini-3.8-flash: {input: 0.0, output: 0.0}

# PortfolioManager 5-tier rating → our action + confidence (heuristic, not calibrated)
rating_map:
  Buy:         {action: buy,  confidence: 0.8}
  Overweight:  {action: buy,  confidence: 0.6}
  Hold:        {action: hold, confidence: 0.5}
  Underweight: {action: sell, confidence: 0.6}
  Sell:        {action: sell, confidence: 0.8}
